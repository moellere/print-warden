# Copy to printers.yaml. One entry per printer.
printers:
  garagex4:
    location: covington
    moonraker: http://x4.local:7125
    cameras:
      nozzle: http://x4.local/webcam/?action=snapshot   # C920 on the X beam, rides with Z
      bed: http://nas.local:5000/api/bedcam/latest.jpg    # a fixed camera via Frigate, whole-bed view
      overview: http://nas.local:5000/api/benchcam/latest.jpg   # optional: any extra view (e.g. an overhead bench camera)
    flip_v:
      nozzle: true          # the C920 hangs upside down; Obico applies the same vertical flip
      bed: true
    light: light.workbench
    bed_check:               # compare the bed camera to an empty-bed reference (taken on the first "Bed cleared" tap)
      camera: bed
      region: [0.1, 0.15, 0.9, 0.95]   # x0, y0, x1, y1 as fractions of the frame: just the build plate
      threshold: 0.002       # fraction of the region that may differ and still read clear; tune with check_bed
      min_agreements: 10     # labelled checks in a row that must agree before auto_start may act
      pose: {y: 220, z: 150}   # bed-slinger + frame camera: where the bed sits for every check. Warden-sliced jobs
                               # park here (Z only ever higher) and leave steppers on; read Y from Mainsail
      rehome_y: false        # true: if steppers were released, G28 Y and move back to pose.y (Z never moves)
    auto_start: false        # true: start newly staged jobs without a tap when the bed check allows it
    auto_start_hours: "08:00-22:00"    # local time; unattended starts only inside this window
    finish_window: "07:00-23:00"       # unattended starts only if the estimated finish falls inside
    slicer:                  # OrcaSlicer preset names from the Artillery vendor directory
      machine: Artillery Sidewinder X4 Plus 0.4 nozzle
      processes:
        draft: 0.24mm Draft @Artillery X4Plus 0.4 nozzle
        standard: 0.20mm Standard @Artillery X4Plus 0.4 nozzle
        strength: 0.20mm Strength @Artillery X4Plus 0.4 nozzle
        fine: 0.12mm Fine @Artillery X4Plus 0.4 nozzle
      filaments:
        PLA: Artillery Generic PLA
        PETG: Artillery Generic PETG
        ABS: Artillery Generic ABS
        ASA: Artillery Generic ASA
        TPU: Artillery Generic TPU
        PLA-CF: Artillery Generic PLA-CF
    rules:
      heater_deviation_c: 8
      heater_deviation_s: 90
      stall_minutes: 10
      layer_snapshot: true
      first_layer_check: 2   # layer at which the phone asks "first layers look right?" (0 = off)
      fan_stall_s: 10        # fans with a tachometer: commanded on but < fan_min_rpm this long -> critical
      temp_limits:           # sensor name (with or without "temperature_sensor ") -> °C; mcu/host sensors default to 75
        chamber: 60

  wyolax1:
    location: wyola
    moonraker: http://x1.local:7125
    track_spool_usage: true   # false if this Moonraker's own [spoolman] component already reports usage
    power_device: printer     # Moonraker [power printer] (Sonoff); off between prints, MCU stays on USB power.
                              # Start = power on, FIRMWARE_RESTART until Klipper is ready (two after MCU comm loss), then print.
    cameras:
      bed: http://x1.local/webcam/?action=snapshot   # crowsnest PiCam
    slicer:
      machine: Artillery Sidewinder X1 0.4 nozzle
      processes:
        draft: 0.24mm Draft @Artillery X1
        standard: 0.20mm Standard @Artillery X1
        optimal: 0.16mm Optimal @Artillery X1
      filaments:
        PLA: Artillery Generic PLA
        PETG: Artillery Generic PETG
        ABS: Artillery Generic ABS
    rules:
      stall_minutes: 10

home_assistant:
  url: https://homeassistant.local:8123
  webhook_id: print-warden-alert
  token_env: HA_BEARER_TOKEN
  verify_tls: false
  notify_service: notify.mobile_app_your_phone   # gets the Start / Skip buttons
  action_secret_env: HA_ACTION_SECRET            # guards POST /ha/action; the route is off if unset
  publish_entities: true                         # sensor.print_warden_<printer>_{state,progress,finish,queue,bed,material}

obico:
  url: http://nas.local:3334
  webhook_secret_env: OBICO_WEBHOOK_SECRET

spoolman:
  url: http://nas.local:7912     # spools + materials live here; set_active_spool records what is loaded

slicer:
  orca: /opt/orcaslicer/AppRun
  openscad: openscad
  vendor_dir: /opt/orcaslicer/resources/profiles/Artillery
  house_rules: /opt/slicer/house-rules.json     # tree supports (slim), no brim
  blocking_warnings: ["empty layer", "floating", "out of the plate", "outside the plate"]   # Orca log text that blocks a job

alerts:
  quiet_hours: "23:00-07:00"   # info/warning alerts and the first-layer prompt are held; critical always goes out
  # quiet_entity: input_boolean.sleeping   # also quiet while this Home Assistant entity is in quiet_states
  # quiet_states: ["on"]                   # e.g. ["not_home"] for a person/group, ["sleep"] for a mode select
  cooldown_s: 300              # minimum gap between repeats of the same alert kind

policy:
  approval_ttl_minutes: 15   # a Start tap older than this is refused; the request returns to staged

storage:
  dir: ./data          # events.db + snapshots/
  keep_days: 14        # events, snapshots and timelapse frames; rendered timelapses are kept

server:
  host: 0.0.0.0
  port: 8710
  token_env: PRINT_WARDEN_TOKEN   # bearer token for /mcp and /upload
