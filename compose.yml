services:
  print-warden:
    build: .
    # image: ghcr.io/moellere/print-warden:latest   # a released image instead of building
    container_name: print-warden
    restart: unless-stopped
    ports: ["8720:8720"]
    volumes:
      - ./printers.yaml:/config/printers.yaml:ro
      - ./data:/app/data
    env_file: .env          # HA_BEARER_TOKEN, OBICO_WEBHOOK_SECRET, PRINT_WARDEN_TOKEN, HA_ACTION_SECRET
    environment:
      TZ: America/Chicago
