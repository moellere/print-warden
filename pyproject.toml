[project]
name = "print-warden"
version = "0.1.0"
description = "Watches 3D printers (Moonraker + Obico + cameras), applies deterministic rules, exposes an MCP surface, and pushes alerts to Home Assistant."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.10,<2",
  "httpx>=0.27",
  "websockets>=13",
  "pyyaml>=6",
  "uvicorn>=0.30",
  "starlette>=0.38",
  "pillow>=10",
  "python-multipart>=0.0.9",
]

[project.scripts]
print-warden = "print_warden.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print_warden"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
